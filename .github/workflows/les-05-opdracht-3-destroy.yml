---
name: Les 05 - Opdracht 3 Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Typ DESTROY om de infrastructuur te verwijderen"
        required: true
        type: string

env:
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_virtual_network_name: ${{ secrets.AZURE_VIRTUAL_NETWORK_NAME }}
  TF_VAR_subnet_name: ${{ secrets.AZURE_SUBNET_NAME }}
  TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
  TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
  TF_VAR_admin_username: ${{ secrets.AZURE_ADMIN_USERNAME }}
  TF_VAR_ssh_public_key_path: ${{ secrets.AZURE_SSH_PUBLIC_KEY_PATH }}

jobs:
  terraform-destroy:
    name: Verwijder infrastructuur
    runs-on: self-hosted

    steps:
      - name: Controleer confirmatie
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Destroy is niet bevestigd. Typ exact DESTROY om door te gaan."
            exit 1
          fi

      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer Azure login
        run: az account show

      - name: Terraform init met backend-config
        working-directory: les-05-v2/opdracht-3/terraform
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ vars.TF_BACKEND_STATE_KEY }}"

      - name: Terraform destroy plan
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform plan -destroy -input=false -out=tfdestroyplan

      - name: Terraform destroy apply
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform apply -input=false -auto-approve tfdestroyplan