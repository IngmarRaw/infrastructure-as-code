---
name: Les 05 - Opdracht 3 Terraform CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "les-05-v2/opdracht-3/terraform/**/*.tf"
      - "les-05-v2/opdracht-3/terraform/**/*.tftpl"
      - ".github/workflows/les-05-opdracht-3-terraform.yml"
  workflow_dispatch:

env:
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_virtual_network_name: ${{ vars.AZURE_VIRTUAL_NETWORK_NAME }}
  TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
  TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
  TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
  TF_VAR_admin_username: ${{ secrets.AZURE_ADMIN_USERNAME }}
  TF_VAR_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}

jobs:
  terraform-check:
    name: Controleer Terraform code
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer Azure login
        run: az account show

      - name: Terraform fmt check
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform plan -input=false

  terraform-apply:
    name: Deploy infrastructuur
    runs-on: self-hosted
    needs: terraform-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer Azure login
        run: az account show

      - name: Terraform init
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform apply -auto-approve -input=false