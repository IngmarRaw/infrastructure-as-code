---
name: Les 05 - Opdracht 3 Terraform CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "les-05-v2/opdracht-3/terraform/**/*.tf"
      - "les-05-v2/opdracht-3/terraform/**/*.tftpl"
      - ".github/workflows/les-05-opdracht-3-terraform.yml"
  workflow_dispatch:

env:
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_virtual_network_name: ${{ secrets.AZURE_VIRTUAL_NETWORK_NAME }}
  TF_VAR_subnet_name: ${{ secrets.AZURE_SUBNET_NAME }}
  TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
  TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
  TF_VAR_admin_username: ${{ secrets.AZURE_ADMIN_USERNAME }}
  TF_VAR_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}
  TF_VAR_ssh_public_key_path: ${{ secrets.AZURE_SSH_PUBLIC_KEY_PATH }}

jobs:
  terraform-check:
    name: Controleer Terraform code
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Controleer Azure login
        run: az account show

      - name: Terraform fmt check
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init met backend-config
        working-directory: les-05-v2/opdracht-3/terraform
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ vars.TF_BACKEND_STATE_KEY }}"

      - name: Terraform validate
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform validate

      - name: Terraform plan opslaan
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: opdracht-3-tfplan
          path: les-05-v2/opdracht-3/terraform/tfplan
          retention-days: 1

  terraform-apply:
    name: Deploy infrastructuur
    runs-on: self-hosted
    needs: terraform-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: opdracht-3-tfplan
          path: les-05-v2/opdracht-3/terraform

      - name: Controleer Azure login
        run: az account show

      - name: Terraform init met backend-config
        working-directory: les-05-v2/opdracht-3/terraform
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ vars.TF_BACKEND_STATE_KEY }}"

      - name: Terraform apply opgeslagen plan
        working-directory: les-05-v2/opdracht-3/terraform
        run: terraform apply -input=false -auto-approve tfplan