---
name: Les 05 - Opdracht 2 CI/CD

on:
  push:
    branches:
      - test

jobs:
  syntax-check:
    name: Controleer Ansible syntax
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Toon Ansible versie
        run: ansible --version

      - name: Controleer playbook syntax
        working-directory: les-05/opdracht-2
        run: ansible-playbook playbook.yml --syntax-check

  deploy:
    name: Genereer inventory en voer playbook uit
    runs-on: self-hosted
    needs: syntax-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Initialiseer Terraform
        working-directory: les-04/opdracht-1/terraform
        run: terraform init

      - name: Genereer inventory vanuit Terraform outputs
        run: |
          WEB_NAME=$(terraform -chdir=les-04/opdracht-1/terraform output -raw webserver_name)
          WEB_IP=$(terraform -chdir=les-04/opdracht-1/terraform output -raw webserver_ip)
          DB_NAME=$(terraform -chdir=les-04/opdracht-1/terraform output -raw databaseserver_name)
          DB_IP=$(terraform -chdir=les-04/opdracht-1/terraform output -raw databaseserver_ip)

          cat > les-05/opdracht-2/inventory.ini <<EOF
          [webservers]
          ${WEB_NAME} ansible_host=${WEB_IP}

          [databaseservers]
          ${DB_NAME} ansible_host=${DB_IP}

          [all:vars]
          ansible_user=iacuser
          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          ansible_python_interpreter=/usr/bin/python3
          EOF

          test -s les-05/opdracht-2/inventory.ini
          grep '^\[' les-05/opdracht-2/inventory.ini

      - name: Controleer bereikbaarheid webservers
        working-directory: les-05/opdracht-2
        run: ansible -i inventory.ini webservers -m ping

      - name: Draai Ansible playbook
        working-directory: les-05/opdracht-2
        run: ansible-playbook -i inventory.ini playbook.yml