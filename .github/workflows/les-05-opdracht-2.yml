---
name: Les 05 - Opdracht 2 CI/CD

on:
  push:
    branches:
      - test

jobs:
  syntax-check:
    name: Controleer Ansible syntax
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer inventory-configuratie
        run: |
          test -n "$ANSIBLE_INVENTORY"
          test -f "$ANSIBLE_INVENTORY"
          grep '^\[' "$ANSIBLE_INVENTORY"

      - name: Toon Ansible versie
        run: ansible --version

      - name: Controleer playbook syntax
        working-directory: les-05/opdracht-2
        run: ansible-playbook -i "$ANSIBLE_INVENTORY" playbook.yml --syntax-check

  deploy:
    name: Voer Ansible playbook uit
    runs-on: self-hosted
    needs: syntax-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer bereikbaarheid webservers
        working-directory: les-05/opdracht-2
        run: ansible -i "$ANSIBLE_INVENTORY" webservers -m ping

      - name: Draai Ansible playbook
        working-directory: les-05/opdracht-2
        run: ansible-playbook -i "$ANSIBLE_INVENTORY" playbook.yml