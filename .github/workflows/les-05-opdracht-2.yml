---
name: Les 05 - Opdracht 2 CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "les-05-v2/opdracht-2/**"
      - ".github/workflows/les-05-opdracht-2.yml"
  workflow_dispatch:

jobs:
  syntax-check:
    name: Controleer Ansible syntax
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer runner context
        working-directory: les-05-v2/opdracht-2
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          pwd
          ls -la
          ls -la group_vars || true
          cat inventory.azure_rm.yml
          cat group_vars/role_webserver.yml

      - name: Controleer Azure login
        run: az account show

      - name: Controleer dynamic inventory
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          which ansible
          ansible --version
          ansible-inventory -i inventory.azure_rm.yml --graph
          ansible-inventory -i inventory.azure_rm.yml --host les05-webserver

      - name: Controleer playbook syntax
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-playbook -i inventory.azure_rm.yml playbook.yml --syntax-check

  deploy:
    name: Voer Ansible playbook uit
    runs-on: self-hosted
    needs: syntax-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer runner context
        working-directory: les-05-v2/opdracht-2
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          pwd
          ls -la
          ls -la group_vars || true
          cat inventory.azure_rm.yml
          cat group_vars/role_webserver.yml

      - name: Controleer Azure login
        run: az account show

      - name: Controleer bereikbaarheid role_webserver
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible -i inventory.azure_rm.yml role_webserver -m ping

      - name: Draai Ansible playbook
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-playbook -i inventory.azure_rm.yml playbook.yml