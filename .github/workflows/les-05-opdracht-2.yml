---
name: Les 05 - Opdracht 2 CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "les-05/opdracht-2/**"
      - ".github/workflows/les-05-opdracht-2.yml"
  workflow_dispatch:

jobs:
  syntax-check:
    name: Controleer Ansible syntax
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Toon Azure account
        run: az account show

      - name: Installeer Ansible Azure collection
        run: ansible-galaxy collection install -r les-05/opdracht-2/requirements.yml

      - name: Installeer Azure collection dependencies
        run: pip install -r ~/.ansible/collections/ansible_collections/azure/azcollection/requirements-azure.txt

      - name: Controleer dynamic inventory
        working-directory: les-05/opdracht-2
        run: ansible-inventory -i inventory.azure_rm.yml --graph

      - name: Controleer playbook syntax
        working-directory: les-05/opdracht-2
        run: ansible-playbook playbook.yml --syntax-check

  deploy:
    name: Voer Ansible playbook uit
    runs-on: self-hosted
    needs: syntax-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Toon Azure account
        run: az account show

      - name: Installeer Ansible Azure collection
        run: ansible-galaxy collection install -r les-05/opdracht-2/requirements.yml

      - name: Installeer Azure collection dependencies
        run: pip install -r ~/.ansible/collections/ansible_collections/azure/azcollection/requirements-azure.txt

      - name: Controleer bereikbaarheid webservers
        working-directory: les-05/opdracht-2
        run: ansible webservers -m ping

      - name: Draai Ansible playbook
        working-directory: les-05/opdracht-2
        run: ansible-playbook playbook.yml