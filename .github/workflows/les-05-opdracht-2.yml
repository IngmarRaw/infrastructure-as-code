---
name: Les 05 - Opdracht 2 CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "les-05/opdracht-2/**"
      - "les-05/opdracht-1/terraform/**"
      - ".github/workflows/les-05-opdracht-2.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  syntax-check:
    name: Controleer Ansible syntax
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Login op Azure met OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialiseer Terraform remote state
        working-directory: les-05/opdracht-1/terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure

      - name: Genereer tijdelijke Ansible inventory vanuit Terraform outputs
        run: |
          set -euo pipefail

          WEB_NAME=$(terraform -chdir=les-05/opdracht-1/terraform output -raw webserver_name)
          WEB_IP=$(terraform -chdir=les-05/opdracht-1/terraform output -raw webserver_public_ip)

          test -n "$WEB_NAME"
          test -n "$WEB_IP"

          cat > les-05/opdracht-2/inventory.ini <<EOF
          [webservers]
          ${WEB_NAME} ansible_host=${WEB_IP}

          [all:vars]
          ansible_user=iacuser
          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          ansible_python_interpreter=/usr/bin/python3
          EOF

          echo "Inventory is tijdelijk gegenereerd vanuit Terraform outputs:"
          grep '^\[' les-05/opdracht-2/inventory.ini

      - name: Toon Ansible versie
        run: ansible --version

      - name: Controleer playbook syntax
        working-directory: les-05/opdracht-2
        run: ansible-playbook -i inventory.ini playbook.yml --syntax-check

  deploy:
    name: Voer Ansible playbook uit
    runs-on: self-hosted
    needs: syntax-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Login op Azure met OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialiseer Terraform remote state
        working-directory: les-05/opdracht-1/terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure

      - name: Genereer tijdelijke Ansible inventory vanuit Terraform outputs
        run: |
          set -euo pipefail

          WEB_NAME=$(terraform -chdir=les-05/opdracht-1/terraform output -raw webserver_name)
          WEB_IP=$(terraform -chdir=les-05/opdracht-1/terraform output -raw webserver_public_ip)

          test -n "$WEB_NAME"
          test -n "$WEB_IP"

          cat > les-05/opdracht-2/inventory.ini <<EOF
          [webservers]
          ${WEB_NAME} ansible_host=${WEB_IP}

          [all:vars]
          ansible_user=iacuser
          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          ansible_python_interpreter=/usr/bin/python3
          EOF

          echo "Inventory is tijdelijk gegenereerd vanuit Terraform outputs:"
          grep '^\[' les-05/opdracht-2/inventory.ini

      - name: Controleer bereikbaarheid webserver
        working-directory: les-05/opdracht-2
        run: ansible -i inventory.ini webservers -m ping

      - name: Draai Ansible playbook
        working-directory: les-05/opdracht-2
        run: ansible-playbook -i inventory.ini playbook.yml