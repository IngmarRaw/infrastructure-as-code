---
name: Les 05 - Opdracht 2 CI/CD

on:
  push:
    branches:
      - test
    paths:
      - "les-05-v2/opdracht-2/**"
      - ".github/workflows/les-05-opdracht-2.yml"
  workflow_dispatch:

jobs:
  syntax-check:
    name: Controleer Ansible code
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Controleer runner context
        working-directory: les-05-v2/opdracht-2
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          pwd
          ls -la
          ls -la group_vars || true

      - name: Controleer Azure login
        run: az account show

      - name: Activeer Ansible virtual environment
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible --version

      - name: Installeer lint tools indien nodig
        run: |
          source ~/venvs/ansible-azure/bin/activate
          python -m pip install --upgrade yamllint ansible-lint

      - name: Voer ansible-lint uit
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-lint playbook.yml

      - name: Controleer dynamic inventory
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-inventory -i inventory.azure_rm.yml --graph

      - name: Controleer playbook syntax
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-playbook -i inventory.azure_rm.yml playbook.yml --syntax-check

  deploy:
    name: Voer Ansible playbook uit
    runs-on: self-hosted
    needs: syntax-check

    steps:
      - name: Haal repository op
        uses: actions/checkout@v5

      - name: Controleer Azure login
        run: az account show

      - name: Controleer bereikbaarheid role_webserver
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible -i inventory.azure_rm.yml role_webserver -m ping

      - name: Draai Ansible playbook
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-playbook -i inventory.azure_rm.yml playbook.yml

      - name: Controleer webserver service na deployment
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible -i inventory.azure_rm.yml role_webserver -b -m service_facts

      - name: Controleer HTTP response op de webserver
        working-directory: les-05-v2/opdracht-2
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible -i inventory.azure_rm.yml role_webserver -b -m uri -a "url=http://localhost method=GET status_code=200"