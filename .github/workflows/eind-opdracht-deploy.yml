---
name: Eindopdracht - Hybrid Cloud Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Azure, ESXi en Ansible configuratie
    runs-on: self-hosted

    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Configureer 1Password
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Laad secrets uit 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          AZURE_SUBSCRIPTION_ID: op://IAC/Azure/subscription_id
          AZURE_RESOURCE_GROUP_NAME: op://IAC/Azure/resource_group_name
          AZURE_VIRTUAL_NETWORK_NAME: op://IAC/Azure/virtual_network_name
          AZURE_SUBNET_NAME: op://IAC/Azure/subnet_name
          AZURE_ADMIN_USERNAME: op://IAC/Azure/admin_username
          AZURE_SSH_PUBLIC_KEY: op://IAC/Azure/ssh_public_key
          AZURE_LOCATION: op://IAC/Azure/location
          AZURE_VM_SIZE: op://IAC/Azure/vm_size

          ESXI_HOSTNAME: op://IAC/ESXi/hostname
          ESXI_USERNAME: op://IAC/ESXi/username
          ESXI_PASSWORD: op://IAC/ESXi/password
          ESXI_DATASTORE: op://IAC/ESXi/datastore
          ESXI_NETWORK: op://IAC/ESXi/network
          ESXI_OVF_SOURCE: op://IAC/ESXi/ovf_source

          ADMIN_SSH_PRIVATE_KEY: op://IAC/SSH/admin_private_key

          TESTUSER_PUBLIC_KEY: op://IAC/Testuser/public_key
          TESTUSER_PRIVATE_KEY: op://IAC/Testuser/private_key

          TF_BACKEND_RESOURCE_GROUP_NAME: op://IAC/TerraformBackend/resource_group_name
          TF_BACKEND_STORAGE_ACCOUNT_NAME: op://IAC/TerraformBackend/storage_account_name
          TF_BACKEND_CONTAINER_NAME: op://IAC/TerraformBackend/container_name

          HELLO_CONTAINER_IMAGE: op://IAC/Container/image

      - name: Controleer verplichte variabelen
        run: |
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP_NAME"
          test -n "$AZURE_VIRTUAL_NETWORK_NAME"
          test -n "$AZURE_SUBNET_NAME"
          test -n "$AZURE_ADMIN_USERNAME"
          test -n "$AZURE_SSH_PUBLIC_KEY"
          test -n "$AZURE_LOCATION"
          test -n "$AZURE_VM_SIZE"
          test -n "$ESXI_HOSTNAME"
          test -n "$ESXI_USERNAME"
          test -n "$ESXI_PASSWORD"
          test -n "$ESXI_DATASTORE"
          test -n "$ESXI_NETWORK"
          test -n "$ESXI_OVF_SOURCE"
          test -n "$ADMIN_SSH_PRIVATE_KEY"
          test -n "$TESTUSER_PUBLIC_KEY"
          test -n "$TESTUSER_PRIVATE_KEY"
          test -n "$TF_BACKEND_RESOURCE_GROUP_NAME"
          test -n "$TF_BACKEND_STORAGE_ACCOUNT_NAME"
          test -n "$TF_BACKEND_CONTAINER_NAME"
          test -n "$HELLO_CONTAINER_IMAGE"

      - name: Controleer Azure login
        run: az account show > /dev/null

      - name: Installeer Ansible requirements
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-galaxy install -r requirements.yml --force

      - name: Installeer ansible-lint
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          python -m pip install --upgrade ansible-lint

      - name: Voer ansible-lint uit
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-lint playbook.yml

      - name: Terraform fmt Azure
        working-directory: eind-opdracht/terraform/azure
        run: terraform fmt -check -recursive

      - name: Terraform init Azure
        working-directory: eind-opdracht/terraform/azure
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
            -backend-config="key=eind-opdracht-azure.tfstate"

      - name: Terraform validate Azure
        working-directory: eind-opdracht/terraform/azure
        run: terraform validate

      - name: Terraform plan Azure
        working-directory: eind-opdracht/terraform/azure
        run: |
          TF_VAR_subscription_id="$AZURE_SUBSCRIPTION_ID" \
          TF_VAR_resource_group_name="$AZURE_RESOURCE_GROUP_NAME" \
          TF_VAR_location="$AZURE_LOCATION" \
          TF_VAR_virtual_network_name="$AZURE_VIRTUAL_NETWORK_NAME" \
          TF_VAR_subnet_name="$AZURE_SUBNET_NAME" \
          TF_VAR_vm_name_prefix="webserver" \
          TF_VAR_instance_count="1" \
          TF_VAR_vm_size="$AZURE_VM_SIZE" \
          TF_VAR_admin_username="$AZURE_ADMIN_USERNAME" \
          TF_VAR_ssh_public_key="$AZURE_SSH_PUBLIC_KEY" \
          terraform plan -input=false -out=tfplan

      - name: Terraform apply Azure
        working-directory: eind-opdracht/terraform/azure
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform fmt ESXi
        working-directory: eind-opdracht/terraform/esxi
        run: terraform fmt -check -recursive

      - name: Terraform init ESXi
        working-directory: eind-opdracht/terraform/esxi
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
            -backend-config="key=eind-opdracht-esxi.tfstate"

      - name: Terraform validate ESXi
        working-directory: eind-opdracht/terraform/esxi
        run: terraform validate

      - name: Terraform plan ESXi
        working-directory: eind-opdracht/terraform/esxi
        run: |
          TF_VAR_esxi_hostname="$ESXI_HOSTNAME" \
          TF_VAR_esxi_username="$ESXI_USERNAME" \
          TF_VAR_esxi_password="$ESXI_PASSWORD" \
          TF_VAR_disk_store="$ESXI_DATASTORE" \
          TF_VAR_virtual_network="$ESXI_NETWORK" \
          TF_VAR_ovf_source="$ESXI_OVF_SOURCE" \
          TF_VAR_vm_name="database-server" \
          TF_VAR_instance_count="1" \
          TF_VAR_admin_username="$AZURE_ADMIN_USERNAME" \
          TF_VAR_ssh_public_key="$AZURE_SSH_PUBLIC_KEY" \
          terraform plan -input=false -out=tfplan

      - name: Terraform apply ESXi
        working-directory: eind-opdracht/terraform/esxi
        run: terraform apply -input=false -auto-approve tfplan

      - name: Genereer Azure dynamic inventory
        working-directory: eind-opdracht
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          resource_group = os.environ.get("AZURE_RESOURCE_GROUP_NAME", "").strip()
          if not resource_group:
              raise SystemExit("AZURE_RESOURCE_GROUP_NAME is leeg.")

          inventory = f"""---
          plugin: azure.azcollection.azure_rm
          auth_source: cli

          include_vm_resource_groups:
            - {resource_group}

          plain_host_names: true

          conditional_groups:
            platform_azure: "'platform' in tags and tags.platform == 'azure' and 'project' in tags and tags.project == 'eind-opdracht'"
            docker_hosts: "'role' in tags and tags.role == 'dockerhost' and 'project' in tags and tags.project == 'eind-opdracht'"
          """

          path = Path("ansible/inventory.azure_rm.yml")
          path.write_text(inventory, encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Genereer ESXi inventory uit Terraform output
        working-directory: eind-opdracht
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def terraform_json_output(name: str):
              result = subprocess.run(
                  ["terraform", "-chdir=terraform/esxi", "output", "-json", name],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          esxi_vm_ips = terraform_json_output("esxi_vm_ips")

          if not esxi_vm_ips:
              raise SystemExit("Geen ESXi VM IP's gevonden.")

          lines = ["[platform_esxi]"]
          for vm_name, vm_ip in esxi_vm_ips.items():
              if not vm_ip or vm_ip == "null":
                  raise SystemExit("ESXi VM IP is leeg of null.")
              lines.append(f"{vm_name} ansible_host={vm_ip}")

          lines.extend(["", "[docker_hosts:children]", "platform_esxi", ""])

          path = Path("ansible/inventory.esxi.ini")
          path.write_text("\n".join(lines), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Controleer inventories
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-inventory -i inventory.azure_rm.yml -i inventory.esxi.ini --list > /dev/null

      - name: Wacht tot SSH beschikbaar is
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible -i inventory.azure_rm.yml -i inventory.esxi.ini docker_hosts \
            -m wait_for_connection \
            -a "timeout=300"

      - name: Voer Ansible playbook uit
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-playbook -i inventory.azure_rm.yml -i inventory.esxi.ini playbook.yml

      - name: Test SSH van ESXi VM naar Azure VM als testuser
        working-directory: eind-opdracht/ansible
        run: |
          source ~/venvs/ansible-azure/bin/activate
          ansible-inventory -i inventory.azure_rm.yml --list > /tmp/eindopdracht_azure_inventory.json

          AZURE_IP=$(python3 - <<'PY'
          import json

          with open("/tmp/eindopdracht_azure_inventory.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          azure_hosts = data.get("platform_azure", {}).get("hosts", [])
          if not azure_hosts:
              raise SystemExit("Geen Azure host gevonden in platform_azure")

          host = azure_hosts[0]
          hostvars = data.get("_meta", {}).get("hostvars", {}).get(host, {})
          public_ips = hostvars.get("public_ipv4_addresses", [])

          value = hostvars.get("ansible_host") or (public_ips[0] if public_ips else "")
          if not value:
              raise SystemExit("Geen Azure IP gevonden.")

          print(value)
          PY
          )

          ansible -i inventory.esxi.ini platform_esxi -b -m command \
            -a "sudo -u testuser ssh -o StrictHostKeyChecking=no testuser@${AZURE_IP} hostname"