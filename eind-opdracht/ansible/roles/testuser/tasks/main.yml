---
- name: Maak testuser aan
  ansible.builtin.user:
    name: "{{ testuser_name }}"
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true

- name: Maak .ssh map voor testuser
  ansible.builtin.file:
    path: "/home/{{ testuser_name }}/.ssh"
    state: directory
    owner: "{{ testuser_name }}"
    group: "{{ testuser_name }}"
    mode: "0700"

- name: Plaats public key in authorized_keys voor testuser
  ansible.builtin.copy:
    dest: "/home/{{ testuser_name }}/.ssh/authorized_keys"
    content: "{{ testuser_public_key }}\n"
    owner: "{{ testuser_name }}"
    group: "{{ testuser_name }}"
    mode: "0600"

- name: Plaats private key alleen op ESXi VM zodat testuser naar Azure kan SSH'en
  ansible.builtin.copy:
    dest: "/home/{{ testuser_name }}/.ssh/id_ed25519"
    content: "{{ testuser_private_key }}"
    owner: "{{ testuser_name }}"
    group: "{{ testuser_name }}"
    mode: "0600"
  when: "'platform_esxi' in group_names"

- name: Plaats public key file alleen op ESXi VM
  ansible.builtin.copy:
    dest: "/home/{{ testuser_name }}/.ssh/id_ed25519.pub"
    content: "{{ testuser_public_key }}\n"
    owner: "{{ testuser_name }}"
    group: "{{ testuser_name }}"
    mode: "0644"
  when: "'platform_esxi' in group_names"