---
ansible_user: "{{ lookup('env', 'AZURE_ADMIN_USERNAME') }}"
ansible_ssh_private_key_file: "{{ lookup('env', 'ADMIN_SSH_PRIVATE_KEY_FILE') }}"
ansible_python_interpreter: /usr/bin/python3

testuser_name: "testuser"
testuser_public_key: "{{ lookup('env', 'TESTUSER_PUBLIC_KEY') }}"
testuser_private_key_b64: "{{ lookup('env', 'TESTUSER_PRIVATE_KEY_B64') }}"

hello_container_name: "eindopdracht-hello-world"
hello_container_image: "{{ lookup('env', 'HELLO_CONTAINER_IMAGE') }}"
hello_container_port: "8080"