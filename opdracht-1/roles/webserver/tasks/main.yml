---
- name: Controleer of apache2 al geinstalleerd is
  ansible.builtin.command: dpkg -s apache2
  register: apache_check
  changed_when: false
  failed_when: false

- name: Installeer apache2 zonder apt module
  ansible.builtin.command: apt-get install -y apache2
  when: apache_check.rc != 0
  register: apache_install
  changed_when: apache_install.rc == 0
  notify: Restart apache

- name: Toon melding als apache2 al geinstalleerd was
  ansible.builtin.debug:
    msg: "apache2 was al geinstalleerd, daarom is er niets aangepast."
  when: apache_check.rc == 0

- name: Plaats eenvoudige indexpagina
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
  notify: Restart apache

- name: Zorg dat apache2 gestart en enabled is
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Controleer of apache2 actief is
  ansible.builtin.command: systemctl is-active apache2
  register: apache_status
  changed_when: false

- name: Toon apache2 status
  ansible.builtin.debug:
    msg: "apache2 status op {{ inventory_hostname }}: {{ apache_status.stdout }}"

- name: Laat expres een taak falen voor de opdracht
  ansible.builtin.command: /bin/false